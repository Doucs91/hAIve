name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual runs from the Actions tab (e.g. when the last push tip carried
  # [skip ci]). GitHub skips the WHOLE push's CI when the HEAD commit message
  # contains [skip ci] — so never let a sync/[skip ci] commit be a push tip that
  # also includes code. See the release-commit decision in .ai/memories.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Verify build artifacts
        run: pnpm check:artifacts

      # The GitHub Action ships a COMMITTED dist/ and runs from a bare checkout with no
      # `npm install`. Two things must hold, and neither did before v0.55.0: the committed
      # bundle matches source, and it executes with nothing else on disk. A published action
      # that `require()`s an unbundled dependency fails on every consumer's pull request —
      # `npm pack` cannot see that, only running it can.
      - name: Verify the committed action bundle is in sync
        run: git diff --exit-code -- packages/github-action/dist

      - name: Smoke-run the action bundle with no node_modules
        run: |
          scratch="$(mktemp -d)"
          cp packages/github-action/dist/run.js "$scratch/"
          cd "$scratch"
          GH_TOKEN=fake GH_REPO=o/r PR_NUMBER=1 node run.js

      # Type-check BEFORE tests: tests import built dist, so a clean typecheck on a
      # fresh build catches the source/dist desync that otherwise only shows up as
      # confusing test failures. Blocking (no continue-on-error) so regressions fail CI.
      - name: Type-check
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # Quality gate: Hivelore must keep surfacing the right memories/sensors.
      # Fails the build if briefing retrieval / sensor catch-rate regresses.
      - name: Hivelore eval (retrieval + sensor quality gate)
        run: node packages/cli/dist/index.js eval --regression-gate --fail-under 80 --fail-under-catch-rate 100

      # Separate lane: the portable baseline above deliberately disables mutable embeddings.
      # This lane downloads/caches the real local model, builds the index, and gates semantic ranking.
      - name: Cache Hivelore embedding model
        uses: actions/cache@v4
        with:
          path: .cache/hivelore-models
          key: hivelore-bge-small-en-v1.5-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build semantic memory index
        env:
          HIVELORE_MODEL_CACHE: ${{ github.workspace }}/.cache/hivelore-models
        run: node packages/cli/dist/index.js index memories

      - name: Hivelore semantic eval (real embeddings lane)
        env:
          HIVELORE_MODEL_CACHE: ${{ github.workspace }}/.cache/hivelore-models
        run: node packages/cli/dist/index.js eval --semantic-ranking --regression-gate --fail-under 80 --fail-under-catch-rate 100
